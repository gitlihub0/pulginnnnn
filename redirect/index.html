<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qwert- Eklenti Reposu Yönlendirme</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161f30;
            --accent: #2ca5e0;
            --accent-hover: #1f8ac0;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border: #24324d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 32px 28px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        }

        .logo {
            font-size: 42px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(44, 165, 224, 0.2);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent);
            color: #ffffff;
            text-decoration: none;
            padding: 13px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-telegram {
            background: #229ED9;
        }

        .btn-telegram:hover {
            background: #1c86b8;
        }

        .btn-secondary {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #273549;
            color: #ffffff;
        }

        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get("r");
            const statusEl = document.getElementById("statusText");

            if (redirectUrl) {
                statusEl.innerText = "Uygulamaya yönlendiriliyorsunuz...";
                window.location.replace(redirectUrl);
                setTimeout(function() {
                    statusEl.innerText = "Yönlendirme başlamadıysa aşağıdaki butona basınız.";
                    document.getElementById("manualBtn").style.display = "flex";
                }, 1500);
            } else {
                document.getElementById("spinner").style.display = "none";
                statusEl.innerText = "qwert Eklenti Yöneticisi";
                document.getElementById("manualBtn").style.display = "flex";
            } 
        });

        function copyNuvioLink() {
            const link = "https://raw.githubusercontent.com/gitlihub0/pulginnnnn/refs/heads/main/Nuvio/manifest.json";
            navigator.clipboard.writeText(link).then(function() {
                alert("Nuvio Depo Bağlantısı Kopyalandı!\nNuvio uygulamasında Ayarlar > Pluginler kısmına yapıştırabilirsiniz.");
            }).catch(function() {
                prompt("Bağlantıyı kopyalayın:", link);
            });
        }
    </script>
</head>
<body>
    <div class="card">
        <div class="logo">⚡</div>
        <h1>qwert'un Eklenti Reposu</h1>
        <div id="spinner" class="spinner"></div>
        <p id="statusText">Yönlendirme kontrol ediliyor...</p>

        <div class="btn-group">
            <a id="manualBtn" href="cloudstreamrepo://raw.githubusercontent.com/gitlihub0/pulginnnnn/refs/heads/main/CloudStream/repo.json" class="btn" style="display: none;">
                📲 CloudStream'e Repoyu Ekle
            </a>
            <button onclick="copyNuvioLink()" class="btn btn-secondary">
                📋 Nuvio Manifest Bağlantısını Kopyala
            </button>
            <a href="https://t.me/+T8oOnDihMlI2NmVk" target="_blank" class="btn btn-telegram">
                📢 Telegram Topluluğumuza Katıl
            </a>
        </div>

        <div class="footer">
            Geliştirici: <strong>qwert</strong>
        </div>
    </div>
</body>
</html>
